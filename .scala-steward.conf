# Published artifacts must stay readable from Scala 3.6: a library built with a newer
# Scala emits newer TASTy that 3.6 compilers reject (see 3.0.1 / 3.0.2).
# Raise these pins only with a minor or major release.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.6." },
  # 2.3.0+ is built with Scala 3.7
  { groupId = "com.clever-cloud", artifactId = "testcontainers-scala-warp10", version = "2.1." }
]
